# Dataset Configuration (v0.10.4 Production Lazy Caching)
# High-Gamma Dataset (HGD) path resolution & dataset settings

dataset:
  root: "./hgd"
  train_directory: "train1"
  test_directory: "test1"
  description: "High-Gamma Dataset"
  representation: "frequency"
  cache:
    enabled: true
    directory: "outputs/cache"
    max_open_cache_files: 2
    build_if_missing: true
