# Model Architecture Configuration
# Phase 4: Adaptive Channel Attention (ACA)
# Phase 5: Frequency-Aware Transformer Encoder (FATE)
# Phase 6: Classification Head (EEGClassifier)

model:
  attention:
    enabled: true
    hidden_ratio: 4
    dropout: 0.1
    activation: "gelu"
    residual: true

  transformer:
    enabled: true
    d_model: 128
    nhead: 8
    num_layers: 4
    dim_feedforward: 512
    dropout: 0.1
    activation: "gelu"
    batch_first: true

  classifier:
    enabled: true
    num_classes: 4
    hidden_dim: 256
    dropout: 0.3
    activation: "gelu"
    classifier_type: "mlp"
